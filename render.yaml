services:
  - type: web
    name: lumi-educa
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm db:push && pnpm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lumi-educa-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MASTER_PASSWORD
        sync: false

databases:
  - name: lumi-educa-db
    databaseName: lumi_educa
    user: lumi_educa
    plan: starter
